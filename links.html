        :root {

        body {

        .card {

            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        /* LOGO.png é branca; filtro recolore para --bronze (#c8886c) sobre o fundo claro */
        .logo {
            height: 88px;
            width: auto;
            filter: brightness(0) saturate(100%) invert(82%) sepia(86%) saturate(634%) hue-rotate(297deg) brightness(75%) contrast(113%);
        }

        /* A logo ja mostra "Rizzatti - Dermatologia e Saude"; o h1 fica so para
           leitores de tela e para as buscas, sem repetir na tela. */
        h1 {
            position: absolute;
            width: 1px;
            height: 1px;
            overflow: hidden;
            clip: rect(0 0 0 0);
            clip-path: inset(50%);
            white-space: nowrap;
        }

        .local {
            font-size: 0.82rem;
            font-weight: 300;
            color: var(--navy-dark);
            margin: 1.5rem 0 0;
            opacity: 0.85;
        }

        .rule {
            width: 46px;
            height: 1px;
            background: var(--azure);
            margin: 1.8rem 0 2rem;
            border: 0;
        }

        .links {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 0.85rem;
        }

        .link {
            display: flex;
            align-items: center;
            gap: 0.9rem;
            padding: 1.05rem 1.3rem;
            border-radius: 2px;
            text-decoration: none;
            font-size: 0.78rem;
            font-weight: 500;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            transition: all 0.35s ease;
            background: rgba(255, 255, 255, 0.72);
            border: 1px solid rgba(200, 136, 108, 0.35);
            color: var(--navy);
        }

        .link .icon {
            width: 20px;
            height: 20px;
            flex-shrink: 0;
            color: var(--bronze);
            transition: color 0.35s ease;
        }

        .link .label { flex: 1; text-align: left; }

        .link .arrow {
            width: 15px;
            height: 15px;
            flex-shrink: 0;
            opacity: 0.45;
            transition: transform 0.35s ease, opacity 0.35s ease;
        }

        .link:hover {
            background: var(--white);
            border-color: var(--bronze);
            transform: translateY(-2px);
            box-shadow: 0 10px 28px rgba(117, 136, 153, 0.16);
        }

        .link:hover .arrow { transform: translateX(4px); opacity: 0.8; }

        .link:focus-visible {
            outline: 2px solid var(--bronze);
            outline-offset: 3px;
        }

        /* Agendamento: ação principal da página */
        .link-primary {
            background: var(--bronze);
            border-color: var(--bronze);
            color: var(--white);
            box-shadow: 0 8px 26px rgba(200, 136, 108, 0.32);
        }

        .link-primary .icon { color: var(--white); }

        .link-primary:hover {
            background: #b87a5f;
            border-color: #b87a5f;
            color: var(--white);
            box-shadow: 0 12px 32px rgba(200, 136, 108, 0.42);
        }

        footer {

            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--navy-dark);
            opacity: 0.7;
            line-height: 1.9;
        }

        footer a { color: inherit; text-decoration: none; border-bottom: 1px solid rgba(117, 136, 153, 0.3); }
        footer a:hover { color: var(--bronze); border-color: var(--bronze); }

        @media (max-width: 400px) {
            body { padding-top: 2.2rem; }
            .link { padding: 0.95rem 1.1rem; font-size: 0.72rem; letter-spacing: 0.12em; gap: 0.75rem; }
        }

        @media (prefers-reduced-motion: reduce) {
            .link, .link .arrow, .link .icon { transition: none; }
            .link:hover { transform: none; }
        }
